# Override snippet for COIN-LIO on Velodyne VLP-32C (M2DGR dataset).
preprocess:
    lidar_type: 2
    scan_line: 32
    blind: 0.5
    timestamp_unit: 3

image:
    # VLP-32C: 32 rings x 1800 columns at 10 Hz (0.2 deg/col)
    u_shift: 0               # set to 0; run calibrate.launch on a real bag to refine if needed
    intensity_scale: 0.25    # Velodyne intensity is uint8 0..255
    masks: []                # OS0-128 default masks have y=84 → OOB on 32-row image. Disable for VLP-32C.

common:
    lid_topic: /velodyne_points
    imu_topic: /handsfree/imu
